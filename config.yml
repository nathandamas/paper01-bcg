study:
  city: Curitiba
  crs: EPSG:31982
  grid_cells: 502
  regression_cells: 207
  start_year: 2008.0
  monthly_start: "2008-01-01"
  monthly_end: "2026-02-01"
  monthly_observations: 218

curve:
  formula: "a + (b - a) / (1 + exp((m - t) / tau))"
  value_scale_for_fit_m2: 1000.0
  raw_final_min_m2: 1000.0
  corrected_range_min_m2: 5000.0
  max_function_evaluations: 70000
  methods:
    - name: trf
      bounded: true
      minimum_candidate_r2: 0.30
    - name: dogbox
      bounded: true
      minimum_candidate_r2: 0.30
    - name: lm
      bounded: false
      minimum_candidate_r2: 0.20

quality_gate:
  upper_asymptote_rse_max: 0.50
  inflection_month_rse_max: 0.50
  time_constant_rse_max: 1.00
  r2_min: 0.90
  current_to_upper_asymptote_min: 0.85
  inflection_month_min: 6
  inflection_month_max: 210
  degenerate_r2_max_exclusive: 0.99999
  vida_reference_area_min_km2: 0.005

spatial:
  seed: 42
  permutations: 999
  alpha: 0.05
  primary_weights: queen
  sensitivity_weights: rook
  weights_for_moran: binary
  weights_for_models: row_standardized
  local_kernel: gaussian
  local_bandwidth: adaptive
  local_selection: AICc

