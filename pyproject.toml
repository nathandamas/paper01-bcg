[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osm-building-completeness-reproducibility"
version = "1.0.0"
description = "Anonymous reproduction package for OSM building-area growth and completeness analyses"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}
authors = [{name = "Anonymous Authors"}]
dependencies = [
  "numpy==2.4.6",
  "pandas==3.0.0",
  "scipy==1.17.1",
  "matplotlib==3.10.1",
  "geopandas==1.1.3",
  "pyarrow==23.0.0",
  "statsmodels==0.14.6",
  "libpysal==4.14.1",
  "esda==2.9.0",
  "spreg==1.9.0",
  "mgwr==2.2.1",
  "spglm==1.1.0",
  "scikit-learn==1.8.0",
  "shapely==2.1.2",
  "pyproj==3.6.1",
  "PyYAML==6.0.3",
  "Pillow==12.3.0",
  "tabulate==0.9.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
